name: Build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            native-cache: artifacts/ci-native-windows-ucrt64
          - os: ubuntu-22.04
            platform: linux-x86_64
            native-cache: native/linux-x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release version
        run: python scripts/ci/release.py check-version
      - name: Install Linux SDL build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          # Bypass the runner's mirror list, which can stall on the Azure mirror.
          sources=$(mktemp --suffix=.list)
          trap 'rm -f "$sources"' EXIT
          . /etc/os-release
          apt_options=(
            -o "Dir::Etc::sourcelist=$sources"
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=1
            -o Acquire::https::Timeout=15
          )
          packages=(
            build-essential cmake pkg-config python3 libasound2-dev libpulse-dev
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev
            libxinerama-dev libgl1-mesa-dev libudev-dev libdbus-1-dev libwayland-dev libxkbcommon-dev
          )
          fetch_packages() {
            local archive=$1 security=$2
            cat > "$sources" <<EOF
          deb $archive $VERSION_CODENAME main universe
          deb $archive $VERSION_CODENAME-updates main universe
          deb $security $VERSION_CODENAME-security main universe
          EOF
            sudo apt-get "${apt_options[@]}" --error-on=any update &&
              sudo apt-get "${apt_options[@]}" install -y --download-only "${packages[@]}"
          }
          if ! fetch_packages https://archive.ubuntu.com/ubuntu https://security.ubuntu.com/ubuntu; then
            echo '::warning::Could not fetch SDL dependencies from Ubuntu; trying the Kernel.org mirror.'
            mirror=https://mirrors.edge.kernel.org/ubuntu
            fetch_packages "$mirror" "$mirror"
          fi
          sudo apt-get "${apt_options[@]}" install -y --no-download "${packages[@]}"
      - name: Set up UCRT64 GCC
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Identify compilers for cache keys
        id: compilers
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $rust = rustc -vV
          if ($LASTEXITCODE) { throw 'Cannot identify rustc.' }
          $cc = if ($env:RUNNER_OS -eq 'Windows') { Join-Path $env:MSYS2_LOCATION 'ucrt64/bin/gcc.exe' } else { 'cc' }
          $c = & $cc --version
          if ($LASTEXITCODE) { throw 'Cannot identify C compiler.' }
          foreach ($entry in @{ rust = $rust; c = $c }.GetEnumerator()) {
            $bytes = [Text.Encoding]::UTF8.GetBytes($entry.Value -join "`n")
            $digest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes))
            "$($entry.Key)=$digest" >> $env:GITHUB_OUTPUT
          }
      - name: Cache Cargo and SDL build outputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            target/release/.fingerprint
            target/release/build
            target/release/deps
          key: desktop-cargo-v1-${{ matrix.os }}-${{ steps.compilers.outputs.rust }}-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
          restore-keys: desktop-cargo-v1-${{ matrix.os }}-${{ steps.compilers.outputs.rust }}-
      - name: Cache compiled native profiles
        id: native-cache
        uses: actions/cache@v5
        with:
          path: ${{ matrix.native-cache }}
          key: desktop-native-v1-${{ matrix.os }}-${{ steps.compilers.outputs.rust }}-${{ steps.compilers.outputs.c }}-${{ hashFiles('native/usa/coverage/**', 'native/usa/manifest.json', 'tools/aot/**', 'vendor/**', 'Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'scripts/windows/rebuild-native.ps1', 'scripts/linux/project.py') }}
      - name: Build Windows runtime and tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/build.ps1 -Tools
      - name: Test Windows runtime and scripts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          ./scripts/windows/test.ps1 -Offline
          python -m unittest discover -s scripts/tests -v
          if ($LASTEXITCODE) { throw 'Script tests failed.' }
          $env:ADVANCE_AOT_TEST_GCC = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin/gcc.exe'
          cargo test --release --locked --offline --package advance-aot-supplement compiled_pc_and_shift_operations_match_oracle -- --ignored
          if ($LASTEXITCODE) { throw 'Compiled-instruction tests failed.' }
      - name: Build Windows native profiles without a ROM and package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          NATIVE_CACHE: ${{ matrix.native-cache }}
          NATIVE_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
        run: |
          if ($env:NATIVE_CACHE_HIT -eq 'true') {
            Copy-Item -Path "$env:NATIVE_CACHE/*.dll" -Destination native/usa
            Copy-Item -LiteralPath "$env:NATIVE_CACHE/manifest.json" -Destination native/usa/manifest.json
          } else {
            $gcc = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin/gcc.exe'
            ./scripts/windows/rebuild-native.ps1 -NativeProfile all -CoverageOnly -SkipBuild -Install -Gcc $gcc
            New-Item -ItemType Directory -Force $env:NATIVE_CACHE | Out-Null
            Copy-Item -Path native/usa/*.dll -Destination $env:NATIVE_CACHE
            Copy-Item -LiteralPath native/usa/manifest.json -Destination $env:NATIVE_CACHE
          }
          ./scripts/windows/package.ps1 -SkipBuild
      - name: Check Linux shell entry points
        if: runner.os == 'Linux'
        run: for script in ./*.sh scripts/linux/*.sh; do bash -n "$script"; done
      - name: Build Linux runtime and tools
        if: runner.os == 'Linux'
        run: bash ./build.sh
      - name: Build Linux native profiles without a ROM
        if: runner.os == 'Linux' && steps.native-cache.outputs.cache-hit != 'true'
        run: bash ./rebuild-native.sh --skip-build --coverage-only
      - name: Test Linux runtime, scripts and compiled instructions
        if: runner.os == 'Linux'
        run: bash ./test.sh --offline
      - name: Package Linux
        if: runner.os == 'Linux'
        run: bash ./package.sh --skip-build
      - name: Upload packaged builds
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  web:
    name: WebAssembly
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build web package without a ROM
        run: python3 web/build.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Smoke test web package
        run: |
          node --check dist/web/play.js
          node --check dist/web/input.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const wasm = await readFile('dist/web/advance_liberty_web.wasm');
          const { instance } = await WebAssembly.instantiate(wasm, {
            host: { now_ms: () => performance.now() },
          });
          const core = instance.exports;
          assert.equal(core.start(), 0);
          assert.equal(core.frame(0x3ff, 0, 0, 0), 0);
          JS
      - name: Upload web package
        uses: actions/upload-artifact@v6
        with:
          name: web-build
          path: dist/web/
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download both tested platform packages
        uses: actions/download-artifact@v7
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/release.py publish --directory release-assets
