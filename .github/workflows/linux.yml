name: Linux build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxinerama-dev libgl1-mesa-dev libudev-dev libdbus-1-dev libwayland-dev libxkbcommon-dev
      - name: Check shell entry points
        run: for script in ./*.sh scripts/linux/*.sh; do bash -n "$script"; done
      - name: Build runtime and AOT tools (no ROM required)
        run: bash ./build.sh
      - name: Test runtime, tools and compiled native instructions
        run: bash ./test.sh --offline
      # A complete playable package requires the user's ROM to generate profiles.
      # CI never downloads, embeds or uploads a cartridge dump or extracted assets.
